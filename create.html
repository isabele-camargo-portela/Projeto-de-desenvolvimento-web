<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <title>Collage-journal | Criar</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Collage-journal</a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent"
                    aria-controls="navbarContent"
                    aria-expanded="false"
                    aria-label="Abrir menu"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="make.html">Como funciona</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="create.html">Criar</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container-fluid create-page">
        <section class="create-header">
            <h1>Crie sua página</h1>
            <p>Monte sua própria composição e transforme suas ideias em uma página de journal.</p>
        </section>
        <section class="file-name-section">
            <div class="container">
                <label for="fileName" class="form-label">Nome da página</label>
                <input type="text" class="form-control" id="fileName" placeholder="ex: meu-journal">
            </div>
        </section>
        <section class="editor container-fluid">
            <div class="row">
                <aside class="col-lg-3 editor-sidebar">
                    <h2>Elementos</h2>
                    <div class="tool-section">
                        <h3>Texto</h3>
                        <button type="button" id="addText" class="btn btn-outline-dark" >+ Adicionar texto</button>
                    </div>
                    <div class="tool-section">
                        <h3>Imagens</h3>
                        <div class="image-options">
                            <button class="image-option" data-image="img1">
                                <img src="img/image-from-rawpixel-id-2339490-png.png" alt="Imagem 1" >
                            </button>
                            <button class="image-option" data-image="img2">
                                <img src="img/image-from-rawpixel-id-2340619-png.png" alt="Imagem 2" >
                            </button>
                            <button class="image-option" data-image="img3">
                                <img src="img/image-from-rawpixel-id-3958798-png.png" alt="Imagem 3">
                            </button>
                        </div>
                    </div>
                </aside>
                <section class="col-lg-9 editor-workspace">
                    <div class="canvas-container">
                        <canvas id="journalCanvas" width="900" height="700">
                        </canvas>
                    </div>
                </section>
            </div>
        </section>
        <section class="save-section text-center">
            <button type="button" class="btn btn-dark" id="saveJournal">Salvar página</button>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/create.js"></script>
    <button
        type="button"
        class="btn btn-outline-dark bug-button"
        data-bs-toggle="modal"
        data-bs-target="#bugModal"
    >
           Relatar um problema
    </button>
    <div
        class="modal fade"
        id="bugModal"
        tabindex="-1"
        aria-labelledby="bugModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog">
            <diV class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title"id="bugModalLabel">Encontrou um problema?</h2>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"
                    ></button>
                </div>
                <div class="modal-body">
                    <p>Conte para nós o que aconteceu.</p>
                    <form id="bugForm">
                        <div class="mb-3">
                            <label for="bugDescription" class="form-label">Descrição do problema</label>
                            <textarea
                                class="form-control"
                                id="bugDescription"
                                rows="5"
                                placeholder="Descreva o problema..."
                                required
                            ></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="topo_footer"></div>
        <div class="conteudo_footer">
            <p>@todos os direitos reservados</p>
        </div>
    </footer>
</body>
</html>
